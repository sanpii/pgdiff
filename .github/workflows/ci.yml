on: [pull_request, push]

env:
  CARGO_TERM_COLOR: always
  OLD_URL: postgres://postgres:postgres@localhost/old
  NEW_URL: postgres://postgres:postgres@localhost/new

jobs:
  lint_fmt:
    name: cargo fmt
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formating
        run: cargo fmt -- --check

  lint_clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- --deny warnings

  lint_elephantry:
    name: Elephantry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: ikalnytskyi/action-setup-postgres@v9
        id: postgres
      - name: Install dylint
        run: cargo install cargo-dylint dylint-link
      - name: Run lints
        run: cargo dylint --git https://github.com/elephantry/lints --all
        env:
          PGSERVICE: ${{ steps.postgres.outputs.service-name }}

  lint_shear:
    name: Shear
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-shear
        run: cargo install cargo-shear
      - name: Run cargo-shear
        run: cargo shear --deny-warnings

  tests:
    name: Tests
    strategy:
      matrix:
        mode: ["debug", "release"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ikalnytskyi/action-setup-postgres@v9
        id: postgres

      - name: Create databases
        run: |
          psql --command "create database old;";
          psql --command "create database new;";
        env:
          PGSERVICE: ${{ steps.postgres.outputs.service-name }}

      - name: Run tests (debug)
        if: matrix.mode == 'debug'
        run: RUST_TEST_THREADS=1 cargo test

      - name: Run tests (release)
        if: matrix.mode == 'release'
        run: RUST_TEST_THREADS=1 cargo test --release

  apply:
    name: Apply patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ikalnytskyi/action-setup-postgres@v9
        id: postgres

      - name: Create databases
        run: |
          psql --command "create database old;";
          psql --command "create database new;";
        env:
          PGSERVICE: ${{ steps.postgres.outputs.service-name }}

      - name: Run
        run: |
          RESTRICT_KEY=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 63)
          pg_dump --schema-only --restrict-key=$RESTRICT_KEY new > new.dump
          psql --file tests/diff.sql old
          pg_dump --schema-only --restrict-key=$RESTRICT_KEY old > old.dump
          diff -u old.dump new.dump
        env:
          PGSERVICE: ${{ steps.postgres.outputs.service-name }}
